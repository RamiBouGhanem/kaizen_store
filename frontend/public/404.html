<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      // Store the current path and redirect to index.html with the path as hash
      const path = window.location.pathname + window.location.search;
      if (path !== '/') {
        // Store the original path in sessionStorage
        sessionStorage.setItem('originalPath', path);
        // Redirect to root - the React app will handle the routing
        window.location.href = '/';
      }
    </script>
  </head>
  <body>
    <noscript>
      <h1>Page Not Found</h1>
      <p>Please enable JavaScript to use this application.</p>
      <p><a href="/">Go to Homepage</a></p>
    </noscript>
  </body>
</html>
